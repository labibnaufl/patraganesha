name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. Checkout source code
      # ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Set up Node.js
      # ─────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ─────────────────────────────────────────
      # 3. Install ALL dependencies (including devDeps for prisma, typescript, etc.)
      # ─────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────
      # 4. Create .env for build
      # ─────────────────────────────────────────
      - name: Create .env file
        run: |
          cat <<EOF > .env
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          EOF

      # ─────────────────────────────────────────
      # 5. Generate Prisma client (use LOCAL binary, not npx which fetches latest)
      # ─────────────────────────────────────────
      - name: Generate Prisma Client
        run: ./node_modules/.bin/prisma generate

      # ─────────────────────────────────────────
      # 6. Build Next.js app (output: standalone)
      # ─────────────────────────────────────────
      - name: Build Next.js
        run: |
          npm run build
          # The standalone build needs the public folder and static assets copied into it
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}

      # ─────────────────────────────────────────
      # 7. Strip devDependencies in-place (keeps already-generated Prisma client
      #    in node_modules/.prisma and node_modules/@prisma/client intact)
      # ─────────────────────────────────────────
      - name: Prune devDependencies for production
        run: npm prune --omit=dev

      # ─────────────────────────────────────────
      # 8. Set up SSH key + known_hosts, then rsync built app to server
      #    (Writing key to file avoids 'error in libcrypto' from stdin mangling)
      # ─────────────────────────────────────────
      - name: Deploy files to server via rsync
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Write the private key to a temp file with strict permissions
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Trust the server's host key
          ssh-keyscan -p 65002 -H 147.93.80.85 >> ~/.ssh/known_hosts

          # Rsync the standalone build directory to the server
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.htaccess' \
            --exclude='src' \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            .next/standalone/ \
            u537263380@147.93.80.85:~/domains/lightgrey-mandrill-137132.hostingersite.com/public_html/

      # ─────────────────────────────────────────
      # 9. SSH into server: install PM2 (if missing) and restart app
      #    (reuses ~/.ssh/deploy_key written in step 8)
      # ─────────────────────────────────────────
      - name: Restart app on server via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p 65002 \
            -o StrictHostKeyChecking=no \
            u537263380@147.93.80.85 << 'ENDSSH'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            APP_DIR=~/domains/lightgrey-mandrill-137132.hostingersite.com/public_html
            cd $APP_DIR

            pm2 describe patra-digital-hub > /dev/null 2>&1 \
              && pm2 restart patra-digital-hub \
              || pm2 start "server.js" --name patra-digital-hub

            pm2 save
          ENDSSH