name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. Checkout source code
      # ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Set up Node.js
      # ─────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ─────────────────────────────────────────
      # 3. Install ALL dependencies (including devDeps for prisma, typescript, etc.)
      # ─────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────
      # 4. Create .env for build
      # ─────────────────────────────────────────
      - name: Create .env file
        run: |
          cat <<EOF > .env
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          EOF

      # ─────────────────────────────────────────
      # 5. Generate Prisma client (use LOCAL binary, not npx which fetches latest)
      # ─────────────────────────────────────────
      - name: Generate Prisma Client
        run: ./node_modules/.bin/prisma generate

      # ─────────────────────────────────────────
      # 6. Build Next.js app
      # ─────────────────────────────────────────
      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}

      # ─────────────────────────────────────────
      # 7. Strip devDependencies in-place (keeps already-generated Prisma client
      #    in node_modules/.prisma and node_modules/@prisma/client intact)
      # ─────────────────────────────────────────
      - name: Prune devDependencies for production
        run: npm prune --omit=dev

      # ─────────────────────────────────────────
      # 9. Scan server host key (prevents "Host key verification failed")
      # ─────────────────────────────────────────
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 -H 147.93.80.85 >> ~/.ssh/known_hosts

      # ─────────────────────────────────────────
      # 10. Copy built app to server via rsync
      #     We sync: .next/, public/, node_modules/, package.json, prisma/
      # ─────────────────────────────────────────
      - name: Deploy files to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avz
            --delete
            --exclude='.git'
            --exclude='.github'
            --exclude='.env'
            --exclude='src'
          path: ./
          remote_path: ~/domains/lightgrey-mandrill-137132.hostingersite.com/public_html/
          remote_host: 147.93.80.85
          remote_port: 65002
          remote_user: u537263380
          remote_key: ${{ secrets.DEPLOY_KEY }}

      # ─────────────────────────────────────────
      # 11. SSH into server: install PM2 (if missing) and restart app
      # ─────────────────────────────────────────
      - name: Restart app on server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 147.93.80.85
          port: 65002
          username: u537263380
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Load NVM so node/npm/pm2 commands are available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Install PM2 globally if not already installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            APP_DIR=~/domains/lightgrey-mandrill-137132.hostingersite.com/public_html

            # Restart or start the app with PM2
            cd $APP_DIR
            pm2 describe patra-digital-hub > /dev/null 2>&1 \
              && pm2 restart patra-digital-hub \
              || pm2 start "node_modules/.bin/next start -p 3000" --name patra-digital-hub

            # Save PM2 process list so it survives server restarts
            pm2 save